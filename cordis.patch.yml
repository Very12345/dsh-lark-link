# dsh-lark-link bundle patch — inserts the bridge plugin entry into the
# composition. Users install via `dsh plugin add @very12345/dsh-lark-link`.
#
# `name` is the package specifier the dsh loader imports, resolved from the
# profile directory. It must be the FULL published package name: the bare
# `dsh-lark-link` this fork used to declare is not resolvable in a profile,
# because pnpm installs the package under its scoped name, so the entry's
# import failed and the plugin never activated.
- insert:
    - id: lark-link
      name: '@very12345/dsh-lark-link'
      config:
        enabled: !!js "process.env.DSH_LARK_LINK_ENABLED ?? 'true'"
        # Feishu app credentials. Prefer the one-click `/lark setup` flow
        # (QR registerApp); manual entry writes to ctx.credentials.
        appId: !!js "process.env.DSH_LARK_LINK_APP_ID ?? ''"
        # groupPolicy: open | mention | keywords | reply
        groupPolicy: !!js "process.env.DSH_LARK_LINK_GROUP_POLICY ?? 'mention'"
        # denyList: exact command prefixes denied outright (no prompt, no card).
        denyList: []
